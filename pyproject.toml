[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "widegap"
version = "0.5.0"
description = "Verified numerical and physics-informed solvers for wide-bandgap semiconductor device equations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sachin Chandra Goolla" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# CPU-only torch is recommended:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
pinn = ["torch>=2.2"]
test = ["pytest>=8", "sympy>=1.12"]
plot = ["matplotlib>=3.8"]
dev = ["ruff>=0.6", "pre-commit>=3.7", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
widegap = ["materials/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pinn: tests that require torch",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by ruff format
